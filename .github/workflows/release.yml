name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  IMAGE: snodra/snodra-event-browser

jobs:
  # The uploads attach to an existing release, so it is created first.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES="Container image: \`$IMAGE:${VERSION#v}\`
          Binaries: one archive per target below."
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REPOSITORY#*/} $VERSION" --generate-notes --notes "$NOTES"
          fi

  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The same binary, without Docker: static musl builds for Linux, native builds for macOS and
  # Windows. librdkafka, zlib and zstd come from source, so no runner needs a system package.
  binaries:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: snodra-event-browser
          target: ${{ matrix.target }}
          archive: snodra-event-browser-$tag-$target
          include: LICENSE,README.md
          token: ${{ secrets.GITHUB_TOKEN }}
