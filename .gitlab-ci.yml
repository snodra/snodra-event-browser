workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

# Shell-executor pipeline: the runners have Rust, protoc, cmake, Docker and buildx installed.
# Images and services are intentionally not used; the tests (Testcontainers: the hub's image and
# the event store) talk to the host daemon.

stages:
  - check
  - test
  - release

variables:
  CARGO_TERM_COLOR: always
  TESTCONTAINERS_RYUK_DISABLED: "true"

# snodra-messaging-rs, a git dependency, is named by its ssh URL (works on a developer machine with
# ssh access). On the runner cargo fetches it with the git CLI over https with the deploy token
# SNODRA_MESSAGING_RS_DEPLOY_USER / _TOKEN: the URL rewrite lives in the job's environment only
# (GIT_CONFIG_COUNT, git 2.31+), so nothing is written to the shell runner's git configuration and
# no command line shows the token.
.snodra-messaging-rs-fetch:
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    SNODRA_MESSAGING_RS_SSH_URL: "ssh://git@local.gitlab.damoreira.ml/snodra/snodra-messaging-rs.git"
  before_script:
    - export GIT_CONFIG_COUNT=1
    - export GIT_CONFIG_KEY_0="url.https://${SNODRA_MESSAGING_RS_DEPLOY_USER}:${SNODRA_MESSAGING_RS_DEPLOY_TOKEN}@${CI_SERVER_HOST}/snodra/snodra-messaging-rs.git.insteadOf"
    - export GIT_CONFIG_VALUE_0="$SNODRA_MESSAGING_RS_SSH_URL"

fmt:
  extends: .snodra-messaging-rs-fetch
  stage: check
  script:
    - cargo fmt --all -- --check

clippy:
  extends: .snodra-messaging-rs-fetch
  stage: check
  script:
    - cargo clippy --all-targets --all-features -- -D warnings

# The tests behind a real hub run the hub's released image (SNODRA_SERVER_IMAGE, the group variable
# the hub's release maintains), pulled from Harbor first; the end-to-end test adds the event
# store's container.
test:
  extends: .snodra-messaging-rs-fetch
  stage: test
  before_script:
    - !reference [.snodra-messaging-rs-fetch, before_script]
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST"
    - docker pull "$SNODRA_SERVER_IMAGE"
  script:
    - cargo test --all-features -- --test-threads=1

release:
  stage: release
  resource_group: release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: "0"
    DOCKER_BUILDKIT: "1"
    IMAGE_NAME: snodra-event-browser
    SNODRA_MESSAGING_RS_SSH_URL: "ssh://git@local.gitlab.damoreira.ml/snodra/snodra-messaging-rs.git"
  before_script:
    - git fetch --tags --force
  script:
    - |
      set -euo pipefail
      CURRENT=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
      if [ -z "$CURRENT" ]; then CURRENT="v0.0.0"; fi
      if [ -n "${RELEASE_VERSION:-}" ]; then
        VERSION="${RELEASE_VERSION#v}"
        NEXT="v$VERSION"
        echo "Using explicit RELEASE_VERSION: $VERSION ($NEXT)"
      else
        if git describe --tags --exact-match >/dev/null 2>&1; then
          echo "HEAD is already tagged $(git describe --tags --exact-match); nothing to do."
          exit 0
        fi
        BUMP="${SEMVER_BUMP:-}"
        if [ -z "$BUMP" ]; then
          if [ "$CURRENT" = "v0.0.0" ]; then
            LOG=$(git log --format='%s%n%b')
          else
            LOG=$(git log "$CURRENT..HEAD" --format='%s%n%b')
          fi
          if [ -z "$LOG" ]; then
            echo "No new commits since $CURRENT; no release."
            exit 0
          fi
          if grep -qE 'BREAKING[ -]CHANGE|^[A-Za-z]+(\([^)]*\))?!:' <<< "$LOG"; then
            BUMP=major
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$LOG"; then
            BUMP=minor
          else
            BUMP=patch
          fi
        fi
        case "$BUMP" in
          major|minor|patch) ;;
          *) echo "SEMVER_BUMP must be major, minor or patch"; exit 1 ;;
        esac
        V="${CURRENT#v}"
        IFS=. read -r MAJ MIN PAT <<< "$V"
        case "$BUMP" in
          major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
          minor) MIN=$((MIN+1)); PAT=0 ;;
          patch) PAT=$((PAT+1)) ;;
        esac
        NEXT="v$MAJ.$MIN.$PAT"
        VERSION="$MAJ.$MIN.$PAT"
        echo "Current: $CURRENT; bump: $BUMP; next: $NEXT"
      fi
      if [ "${DRY_RUN:-false}" = "true" ]; then
        echo "DRY_RUN: not tagging or publishing"
        exit 0
      fi
      IMAGE="$HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME"
      # The image is built before anything is published: a failed build (it fetches
      # snodra-messaging-rs with the deploy token) stops the release with no tag and no image.
      # The builder reads a git configuration as the BuildKit secret `gitconfig` (never a layer)
      # that rewrites the library's ssh URL to https with the deploy token.
      SNODRA_GITCONFIG=$(printf '[url "https://%s:%s@%s/snodra/snodra-messaging-rs.git"]\n\tinsteadOf = %s\n' \
        "$SNODRA_MESSAGING_RS_DEPLOY_USER" "$SNODRA_MESSAGING_RS_DEPLOY_TOKEN" "$CI_SERVER_HOST" "$SNODRA_MESSAGING_RS_SSH_URL")
      export SNODRA_GITCONFIG
      docker build --secret id=gitconfig,env=SNODRA_GITCONFIG -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
      unset SNODRA_GITCONFIG
      if ! git rev-parse "$NEXT" >/dev/null 2>&1; then
        git config user.name "snodra CI"
        git config user.email "ci@damoreira.ml"
        git tag -a "$NEXT" -m "$CI_PROJECT_NAME $NEXT"
        git push "$CI_REPOSITORY_URL" "$NEXT"
      else
        echo "Tag $NEXT already exists, skipping tag push"
      fi
      echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST"
      docker push "$IMAGE:$VERSION"
      docker push "$IMAGE:latest"
      RELEASE=$(jq -n \
        --arg name "$CI_PROJECT_NAME $NEXT" \
        --arg tag "$NEXT" \
        --arg desc "Release $VERSION. Image: $IMAGE:$VERSION." \
        '{name:$name,tag_name:$tag,description:$desc}')
      STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
        --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$RELEASE" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases")
      case "$STATUS" in
        201|409) echo "Release $NEXT is available." ;;
        *) echo "Release API returned $STATUS"; exit 1 ;;
      esac
