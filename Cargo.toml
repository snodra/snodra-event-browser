[package]
name = "snodra-event-browser"
version = "0.3.3"
edition = "2024"
rust-version = "1.99"
description = "Snodra Server's event browser add-on: answers snodra.events.* queries from the event store"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
name = "snodra_event_browser"

[[bin]]
name = "snodra-event-browser"
path = "src/main.rs"

[dependencies]
# The libraries come from crates.io, at the minor this release is built against.
snodra-messaging = "0.8.0"
snodra-messaging-kafka = "0.8.0"
# The Kafka add-on builds librdkafka from source with zstd; the image also links zlib statically
# (as the hub's image did while it read Kafka), so the distroless runtime needs no extra library.
rdkafka = { version = "0.39.0", features = ["cmake-build", "libz-static", "zstd"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Metrics: pushed over OTLP like the hub's and the services'.
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "metrics"] }
# Health (as the hub): the gRPC health service and a `--health-check` probe of it.
tonic = "0.14.8"
tonic-health = "0.14.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "testing"] }
# The tests run the hub from its image (SNODRA_SERVER_IMAGE) and the event store in containers.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["kafka"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
# The digest of a static token in the hub's ACL file.
sha2 = "0.10"
